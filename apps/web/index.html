<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intelligence OS Dashboard</title><style>body{margin:0;font-family:system-ui;background:#090d18;color:#eef2ff}.app{max-width:1000px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#12192b;border:1px solid #27304a;border-radius:16px;padding:18px}.value{font-size:28px;font-weight:700}textarea{width:100%;min-height:120px;background:#0d1322;color:white;border:1px solid #334155;border-radius:12px;padding:12px}button{margin-top:10px;padding:11px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;overflow:auto}</style></head><body><main class="app"><h1>Intelligence OS</h1><p>Idra Kernel — MVP Dashboard</p><section class="grid"><div class="card"><div>System</div><div class="value" id="status">Checking…</div></div><div class="card"><div>Engines</div><div class="value" id="engines">—</div></div><div class="card"><div>Version</div><div class="value" id="version">—</div></div></section><section class="card" style="margin-top:16px"><h2>Intelligence Request</h2><textarea id="message" placeholder="اكتب طلبك هنا..."></textarea><br><button id="run">Run Intelligence</button><pre id="output"></pre></section></main><script>const $=id=>document.getElementById(id);fetch('/api/health').then(r=>r.json()).then(x=>{$('status').textContent=x.status;$('engines').textContent=x.engines.length;$('version').textContent=x.version}).catch(()=>{$('status').textContent='offline'});$('run').onclick=async()=>{const message=$('message').value.trim();if(!message)return;$('output').textContent='Processing…';const token=localStorage.getItem('access_token');const r=await fetch('/api/intelligence',{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({message})});$('output').textContent=JSON.stringify(await r.json(),null,2)};</script></body></html>
